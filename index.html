<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <!-- Tailwind CSS v4 (browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-green-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-3">
            <img src="assets/img/ifrn_logo_branco.svg" alt="">
            <div class="flex flex-col">
                <h1 class="text-xl md:text--2xl font-bold leading-tight">
                    <a href="/"
                        title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte">
                        
                    </a>
                </h1 >
                <p class="text--2xl md:text-xs text-gran-100 md:block">
                    Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                </p>
            </div>

            <!-- MENU HAMBÚRGUER (mobile) -->
            <button id="menuToggle" aria-label="Menu" class="md:hidden text--2xl text-white p-1 rounded hover:bg-green-700 boder-none ">
                <i class="ph ph-list"></i>
            </button>

            <!-- NAVEGAÇÃO PRINCIPAL (desktop) -->
            <nav aria-label="Navegação principal" class=" md:flex items-center gap-4 lg:gap-6 text-xs font-medium border-t border-green-700/50 pt-2">
                <a href="#" >Processos seletivos</a>
                <a href="#">Cursos</a>
                <a href="#">Campi</a>
                <a href="#">Institucional</a>
                <a href="#">Acesso à Informação</a>
                <a href="#">Eventos</a>
                <a href="#">Serviços</a>
            </nav>

            <!-- AÇÕES (ícones, busca, contraste, modo escuro) -->
            <div>
                <!-- Ícones sociais -->
                <div class="flex items-center gap-2 text-green-100 boder-r boder-green-700 pr-3">
                    <a href="#" aria-label="Instagram" class="hover:text-white"><i class="ph ph-instagram-logo"></i></a>
                    <a href="#" aria-label="Twitter" class="hover:text-white"><i class="ph ph-twitter-logo"></i></a>
                    <a href="#" aria-label="LinkedIn" class="hover:text-white"><i class="ph ph-linkedin-logo"></i></a>
                    <a href="#" aria-label="YouTube" class="hover:text-white"><i class="ph ph-youtube-logo"></i></a>
                    <a href="#" aria-label="Spotify" class="hover:text-white"><i class="ph ph-spotify-logo"></i></a>
                    <a href="#" aria-label="TikTok" class="hover:text-white"><i class="ph ph-tiktok-logo"></i></a>
                </div>

                <!-- Busca -->
                <form method="get" action="/search/" class="flex items-center bg-white/10 border border-green-600 rounded-full px-3 py-1 focus-within:bg-white focus-within:text-gray-800 transition">
                    <input type="search" name="query" placeholder="Busca" aria-label="Busca" class="bg-transparent text-xs text-white placeholder-green-200 focus:text-gray-800 focus:placeholder-gray-400 focus:outline-none w-20 sm:w-28" />
                    <button type="submit" aria-label="Pesquisar" class="bg-transparent text-xs text-white placeholder-green-200 focus:text-gray-800 focus:placeholder-gray-400 focus:outline-none w-20 sm:w-28">
                        <i class="ph ph-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Alto contraste -->
                <button id="altocontraste" type="button" aria-label="Alto contraste" class="text-green-100 hover:text-white bg-transparent border-none p-1 cursor-pointer text-base">
                    <i class="ph ph-contrast"></i>
                </button>

                <!-- Modo escuro -->
                <button type="button" aria-label="Modo escuro" class="text-green-100 hover:text-white bg-transparent border-none p-1 cursor-pointer text-base">
                    <i class="ph ph-moon"></i>
                </button>
            </div>
        </div>
    </header>

</body>

</html>
