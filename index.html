<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 7</title>
  <!-- Tailwind CSS v4 (browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <header class="bg-[#1b6b3e] text-white shadow-md">
    <div class="container mx-auto px-6 py-4">

      <!-- LINHA SUPERIOR: LOGO, SLOGAN E AÇÕES -->
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 pb-3">

        <!-- Esquerda: Logo + Slogan -->
        <div class="flex items-center gap-6">
          <img src="assets/img/ifrn_logo_branco.svg" alt="Logo IFRN" class="h-10">
          <h1 class="hidden">
            <a href="/"
              title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte"></a>
          </h1>
          <p class="text-[11px] font-normal leading-tight max-w-[200px] text-white/90">
            Educação, Ciência, Cultura e Tecnologia<br><span class="font-bold">em todo o Rio Grande do Norte</span>
          </p>
        </div>

        <!-- MENU HAMBÚRGUER (mobile) -->
        <button id="menuToggle" aria-label="Menu"
          class="md:hidden text-2xl text-white p-1 rounded hover:bg-green-700 border-none">
          <i class="ph ph-list"></i>
        </button>

        <!-- Direita: Redes Sociais, Acessibilidade e Busca -->
        <div class="hidden md:flex items-center gap-3">

          <!-- Ícones sociais -->
          <div class="flex items-center gap-1.5 border-r border-white/40 pr-3">
            <a href="#" aria-label="Instagram"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition text-sm"><i
                class="ph ph-instagram-logo"></i></a>
            <a href="#" aria-label="Twitter"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition text-sm"><i
                class="ph ph-x-logo"></i></a>
            <a href="#" aria-label="LinkedIn"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition text-sm"><i
                class="ph ph-linkedin-logo"></i></a>
            <a href="#" aria-label="YouTube"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition text-sm"><i
                class="ph ph-youtube-logo"></i></a>
            <a href="#" aria-label="Spotify"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition text-sm"><i
                class="ph ph-spotify-logo"></i></a>
            <a href="#" aria-label="TikTok"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition text-sm"><i
                class="ph ph-tiktok-logo"></i></a>
          </div>

          <!-- Acessibilidade -->
          <div class="flex items-center gap-1.5 pl-1">
            <button id="altocontraste" type="button" aria-label="Alto contraste"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition cursor-pointer text-sm">
              <i class="ph ph-circle-half"></i>
            </button>
            <button type="button" aria-label="Modo escuro"
              class="flex items-center justify-center w-7 h-7 border border-white rounded-full hover:bg-white/20 transition cursor-pointer text-sm">
              <i class="ph ph-moon"></i>
            </button>
          </div>

          <!-- Busca -->
          <form method="get" action="/search/"
            class="flex items-center bg-white text-gray-800 rounded-full px-3 py-1 ml-2 w-48">
            <button type="submit" aria-label="Pesquisar"
              class="bg-transparent text-gray-500 mr-2 cursor-pointer flex items-center">
              <i class="ph ph-magnifying-glass text-sm"></i>
            </button>
            <input type="search" name="query" placeholder="Busca" aria-label="Busca"
              class="bg-transparent text-xs text-gray-800 placeholder-gray-500 focus:outline-none w-full" />
          </form>

        </div>
      </div>

      <!-- LINHA INFERIOR: NAVEGAÇÃO PRINCIPAL -->
      <div class="border-t border-white/30 pt-3">
        <nav aria-label="Navegação principal"
          class="hidden md:flex items-center gap-6 lg:gap-8 text-xs font-bold tracking-wide">
          <a href="#" class="hover:underline">Processos seletivos</a>
          <a href="#" class="hover:underline">Cursos</a>
          <a href="#" class="hover:underline">Campi</a>
          <a href="#" class="hover:underline">Institucional</a>
          <a href="#" class="hover:underline">Acesso à Informação</a>
          <a href="#" class="hover:underline">Eventos</a>
          <a href="#" class="hover:underline">Serviços</a>
        </nav>
      </div>

    </div>
  </header>

</body>

</html>
